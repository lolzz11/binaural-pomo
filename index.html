<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binaural Flow Space</title>
    
    <meta name="theme-color" content="#121214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2316161a%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237E7E86%22 stroke-width=%225%22/><circle cx=%2250%22 cy=%2250%22 r=%228%22 fill=%22%237E7E86%22/></svg>">

    <script>
        const manifestObj = {
            "name": "Binaural Flow Space",
            "short_name": "FlowSpace",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0F0F11",
            "theme_color": "#121214",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2316161a%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237E7E86%22 stroke-width=%225%22/><circle cx=%2250%22 cy=%2250%22 r=%228%22 fill=%22%237E7E86%22/></svg>",
                    "sizes": "512x512",
                    "type": "image/svg+xml",
                    "purpose": "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
    </script>

    <style>
        :root {
            --bg-color: #0F0F11;
            --card-bg: #16161A;
            --card-border: #232329;
            --text-main: #F4F4F6;
            --text-muted: #7E7E86;
            
            --focus-glow: rgba(239, 68, 68, 0.08);
            --focus-accent: #EF4444;
            --break-glow: rgba(16, 185, 129, 0.08);
            --break-accent: #10B981;
            --long-glow: rgba(59, 130, 246, 0.08);
            --long-accent: #3B82F6;
            
            --theme-glow: var(--focus-glow);
            --theme-accent: var(--focus-accent);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease;
        }

        .app-shell::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 10%;
            right: 10%;
            height: 220px;
            background: var(--theme-glow);
            filter: blur(60px);
            border-radius: 50%;
            z-index: 0;
            transition: background 0.5s ease;
            pointer-events: none;
        }

        .relative-content {
            position: relative;
            z-index: 1;
        }

        #pwaInstallBtn {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        #pwaInstallBtn:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        .status-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--theme-accent);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            margin-bottom: 0.5rem;
            transition: color 0.4s ease;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -2px;
            margin: 0.5rem 0;
            font-variant-numeric: tabular-nums;
        }

        .cycle-tracker {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .primary-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .btn-main {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 0.9rem 2rem;
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        .btn-main:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        .btn-sub {
            background: #212126;
            color: var(--text-main);
            border: 1px solid #2D2D35;
            padding: 0.9rem 1.2rem;
        }
        .btn-sub:hover {
            background: #2D2D35;
            color: #ffffff;
        }

        .settings-panel {
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
            text-align: left;
        }

        .panel-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-weight: 700;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .config-row label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #C4C4C6;
        }

        select {
            background: #1F1F24;
            color: var(--text-main);
            border: 1px solid #2D2D35;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: var(--theme-accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 110px;
            background: #2A2A32;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 0.5rem;
        }

        .metric-tile {
            background: #1A1A1F;
            border: 1px solid #212127;
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .reset-link {
            background: none;
            border: none;
            color: #EF4444;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .reset-link:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="app-shell" id="appShell">
    <div class="relative-content">
        <button id="pwaInstallBtn" onclick="triggerPWAInstall()">📥 Install Native App</button>

        <div id="status" class="status-badge">Focus Phase</div>
        <div id="timer" class="timer-display">25:00</div>
        <div id="round" class="cycle-tracker">Round 1 of 4</div>

        <div class="primary-controls">
            <button id="startBtn" class="btn btn-main" onclick="toggleTimer()">Start</button>
            <button class="btn btn-sub" onclick="skipSession()" title="Skip Session">⏭</button>
            <button class="btn btn-sub" onclick="resetTimer()" title="Reset Session">🔄</button>
        </div>

        <!-- Audio Config Panel -->
        <div class="settings-panel">
            <div class="panel-header">Audio System</div>
            <div class="config-row">
                <label for="audioToggle">Binaural Waves</label>
                <input type="checkbox" id="audioToggle" checked onchange="saveAudioSettings(); handleAudioToggle();">
            </div>
            <div class="config-row">
                <label for="wavePreset">Wave State</label>
                <select id="wavePreset" onchange="saveAudioSettings(); updateFrequencies();">
                    <option value="beta">Beta (15 Hz) — Drive</option>
                    <option value="alpha">Alpha (10 Hz) — Flow</option>
                </select>
            </div>
            <div class="config-row">
                <label for="volume">Ambient Vol</label>
                <input type="range" id="volume" min="0" max="0.08" step="0.01" value="0.03" oninput="updateVolume();" onchange="saveAudioSettings();">
            </div>
        </div>

        <!-- Metric Analytics Panel -->
        <div class="settings-panel" style="margin-top: 1.5rem;">
            <div class="panel-header">
                Performance Dashboard
                <button class="reset-link" onclick="clearStats()">Clear Metrics</button>
            </div>
            <div class="dashboard-grid">
                <div class="metric-tile">
                    <div id="statMinutes" class="metric-value">0</div>
                    <div class="metric-label">Focus Mins</div>
                </div>
                <div class="metric-tile">
                    <div id="statRounds" class="metric-value">0</div>
                    <div class="metric-label">Rounds Clear</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- PWA Ecosystem Setup ---
    let deferredPrompt = null;
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'binaural-flow-v5';
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log(err));
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwaInstallBtn').style.display = 'block';
    });

    function triggerPWAInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') document.getElementById('pwaInstallBtn').style.display = 'none';
            deferredPrompt = null;
        });
    }

    // --- Pomodoro Configuration Engine ---
    const FOCUS_TIME = 25;
    const SHORT_BREAK = 5;
    const LONG_BREAK = 15;

    let timeLeft = FOCUS_TIME * 60;
    let timerId = null;
    let currentMode = 'focus'; 
    let roundCount = 1;

    // Audio API Infrastructure Nodes
    let audioCtx = null;
    let oscL = null;
    let oscR = null;
    let gainNode = null;

    let stats = { totalFocusMinutes: 0, completedRounds: 0 };

    window.onload = function() {
        loadAudioSettings();
        loadStats();
        updateDisplay();
    };

    function loadAudioSettings() {
        const savedToggle = localStorage.getItem('fp_audio_enabled');
        if (savedToggle !== null) document.getElementById('audioToggle').checked = (savedToggle === 'true');
        const savedPreset = localStorage.getItem('fp_wave_preset');
        if (savedPreset !== null) document.getElementById('wavePreset').value = savedPreset;
        const savedVol = localStorage.getItem('fp_volume');
        if (savedVol !== null) document.getElementById('volume').value = savedVol;
    }

    function saveAudioSettings() {
        localStorage.setItem('fp_audio_enabled', document.getElementById('audioToggle').checked);
        localStorage.setItem('fp_wave_preset', document.getElementById('wavePreset').value);
        localStorage.setItem('fp_volume', document.getElementById('volume').value);
    }

    function loadStats() {
        const savedStats = localStorage.getItem('fp_stats');
        if (savedStats) {
            stats = JSON.parse(savedStats);
            document.getElementById('statMinutes').innerText = stats.totalFocusMinutes;
            document.getElementById('statRounds').innerText = stats.completedRounds;
        }
    }

    function logFocusMinute() {
        stats.totalFocusMinutes += 1;
        document.getElementById('statMinutes').innerText = stats.totalFocusMinutes;
        localStorage.setItem('fp_stats', JSON.stringify(stats));
    }

    function logCompletedRound() {
        stats.completedRounds += 1;
        document.getElementById('statRounds').innerText = stats.completedRounds;
        localStorage.setItem('fp_stats', JSON.stringify(stats));
    }

    function clearStats() {
        if(confirm("Wipe clear your performance metrics dashboard logs?")) {
            stats = { totalFocusMinutes: 0, completedRounds: 0 };
            localStorage.setItem('fp_stats', JSON.stringify(stats));
            document.getElementById('statMinutes').innerText = "0";
            document.getElementById('statRounds').innerText = "0";
        }
    }

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
        
        const statusEl = document.getElementById('status');
        const root = document.documentElement;
        
        if (currentMode === 'focus') {
            statusEl.innerText = "Focus Phase";
            root.style.setProperty('--theme-glow', 'var(--focus-glow)');
            root.style.setProperty('--theme-accent', 'var(--focus-accent)');
        } else if (currentMode === 'shortBreak') {
            statusEl.innerText = "Short Break";
            root.style.setProperty('--theme-glow', 'var(--break-glow)');
            root.style.setProperty('--theme-accent', 'var(--break-accent)');
        } else {
            statusEl.innerText = "Long Break";
            root.style.setProperty('--theme-glow', 'var(--long-glow)');
            root.style.setProperty('--theme-accent', 'var(--long-accent)');
        }
        document.getElementById('round').innerText = `Round ${roundCount} of 4`;
    }

    function toggleTimer() {
        if (!audioCtx) {
            try {
                initAudio();
            } catch (e) {
                console.log("Audio warmup issue: ", e);
            }
        }

        if (timerId) {
            clearInterval(timerId);
            timerId = null;
            document.getElementById('startBtn').innerText = 'Start';
            stopAudio();
        } else {
            document.getElementById('startBtn').innerText = 'Pause';
            if (currentMode === 'focus') startAudio();
            
            timerId = setInterval(() => {
                timeLeft--;
                if (currentMode === 'focus' && (timeLeft > 0) && (timeLeft % 60 === 0)) {
                    logFocusMinute();
                }
                if (timeLeft < 0) {
                    handlePhaseTransition(true); // pass true to play chime on automatic transition
                }
                updateDisplay();
            }, 1000);
        }
    }

    function handlePhaseTransition(playAlert = false) {
        clearInterval(timerId);
        timerId = null;
        document.getElementById('startBtn').innerText = 'Start';
        stopAudio();

        // Trigger dynamic synthesized audio notifications
        if (playAlert) {
            if (currentMode === 'focus') {
                playChimeNotification('focusEnds');
            } else {
                playChimeNotification('breakEnds');
            }
        }

        if (currentMode === 'focus') {
            logCompletedRound();
            if (roundCount < 4) {
                currentMode = 'shortBreak';
                timeLeft = SHORT_BREAK * 60;
            } else {
                currentMode = 'longBreak';
                timeLeft = LONG_BREAK * 60;
            }
        } else {
            if (currentMode === 'longBreak') {
                roundCount = 1;
            } else {
                roundCount++;
            }
            currentMode = 'focus';
            timeLeft = FOCUS_TIME * 60;
        }
        toggleTimer();
    }

    function skipSession() {
        handlePhaseTransition(false); // Skip intentionally, no notification chime needed
        updateDisplay();
    }

    function resetTimer() {
        clearInterval(timerId);
        timerId = null;
        stopAudio();
        currentMode = 'focus';
        roundCount = 1;
        timeLeft = FOCUS_TIME * 60;
        document.getElementById('startBtn').innerText = 'Start';
        updateDisplay();
    }

    // --- Glitch-Resistant Audio Synthesis Engine ---
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            latencyHint: 'playback'
        });
        
        oscL = audioCtx.createOscillator();
        oscR = audioCtx.createOscillator();
        let pannerL = audioCtx.createStereoPanner();
        let pannerR = audioCtx.createStereoPanner();
        gainNode = audioCtx.createGain();

        pannerL.pan.value = -1; 
        pannerR.pan.value = 1;  
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        oscL.connect(pannerL).connect(gainNode);
        oscR.connect(pannerR).connect(gainNode);
        gainNode.connect(audioCtx.destination);
        updateFrequencies();
