    <script>
        const manifestObj = {
            "name": "Binaural Flow Space",
            "short_name": "FlowSpace",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0F0F11",
            "theme_color": "#121214",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2316161a%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237E7E86%22 stroke-width=%225%22/><circle cx=%2250%22 cy=%2250%22 r=%228%22 fill=%22%237E7E86%22/></svg>",
                    "sizes": "512x512",

                    "purpose": "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

    <style>
        :root {
            --bg-color: #0F0F11;
            --card-bg: #16161A;
            --card-border: #232329;
            --text-main: #F4F4F6;
            --text-muted: #7E7E86;
            
            --focus-glow: rgba(239, 68, 68, 0.08);
            --focus-accent: #EF4444;
            --break-glow: rgba(16, 185, 129, 0.08);
            --break-accent: #10B981;
            --long-glow: rgba(59, 130, 246, 0.08);
            --long-accent: #3B82F6;
            
            --theme-glow: var(--focus-glow);
            --theme-accent: var(--focus-accent);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease;
            text-align: center; /* Forces container contents to remain perfectly centered */
        }

        .app-shell::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 10%;
            right: 10%;
            height: 220px;
            background: var(--theme-glow);
            filter: blur(60px);
            border-radius: 50%;
            z-index: 0;
            transition: background 0.5s ease;
            pointer-events: none;
        }

        .relative-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center; /* Enforces strict alignment of elements */
        }

        .top-action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        #pwaInstallBtn {
            display: none;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--theme-accent);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            margin-bottom: 0.5rem;
            transition: color 0.4s ease;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -2px;
            margin: 0.5rem auto;
            font-variant-numeric: tabular-nums;
            text-align: center;
            width: 100%;
        }

        .cycle-tracker {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 500;
            width: 100%;
            text-align: center;
        }

        .primary-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .btn-main {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 0.9rem 2rem;
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        .btn-main:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        .btn-sub {
            background: #212126;
            color: var(--text-main);
            border: 1px solid #2D2D35;
            padding: 0.9rem 1.2rem;
        }
        .btn-sub:hover {
            background: #2D2D35;
            color: #ffffff;
        }

        .settings-panel {
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
            text-align: left;
            width: 100%;
        }

        .panel-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-weight: 700;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .config-row label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #C4C4C6;
        }

        select {
            background: #1F1F24;
            color: var(--text-main);
            border: 1px solid #2D2D35;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: var(--theme-accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 110px;
            background: #2A2A32;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 0.5rem;
        }

        .metric-tile {
            background: #1A1A1F;
            border: 1px solid #212127;
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .reset-link {
            background: none;
            border: none;
            color: #EF4444;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .reset-link:hover { opacity: 1; }

        .discrete-auth-toggle {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: underline;
            margin-top: 1.5rem;
            cursor: pointer;
            text-align: center;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .discrete-auth-toggle:hover { opacity: 1; }

        .auth-panel {
            background: #1A1A1F;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            margin-top: 1rem;
            display: none;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        
        .auth-notice {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-panel input {
            width: 100%;
            box-sizing: border-box;
            background: #111115;
            border: 1px solid #2D2D35;
            color: var(--text-main);
            padding: 0.6rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            outline: none;
        }
        .auth-btn-group {
            display: flex;
            gap: 8px;
        }
        .auth-btn {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }
        .auth-btn-primary { background: var(--text-main); color: var(--bg-color); }
        .auth-btn-secondary { background: transparent; border: 1px solid #2D2D35; color: var(--text-muted); }
        
        .user-badge {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: none;
            word-break: break-all;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRY64EvtgTPPCaNA2q9BiQyV0_3HZuD6E",
            authDomain: "flowspace-bf064.firebaseapp.com",
            projectId: "flowspace-bf064",
            storageBucket: "flowspace-bf064.firebasestorage.app",
            messagingSenderId: "475448486655",
            appId: "1:475448486655:web:a0b1ce563695397e283aca",
            measurementId: "G-X3K6ZVSVBF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseSignUp = async (email, password) => {
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", cred.user.uid), window.getStatsObject());
                document.getElementById('authPanel').style.display = 'none';
            } catch (err) { alert(err.message); }
        };

        window.firebaseLogIn = async (email, password) => {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('authPanel').style.display = 'none';
            } catch (err) { alert(err.message); }
        };

        window.firebaseLogOut = () => { signOut(auth); };

        window.syncStatsToCloud = async () => {
            if (auth.currentUser) {
                try {
                    await setDoc(doc(db, "users", auth.currentUser.uid), window.getStatsObject());
                } catch(e) { console.error("Cloud push failed:", e); }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const badge = document.getElementById('userBadge');
            const actionBtnContainer = document.getElementById('authActionGroup');
            const noticeEl = document.getElementById('authNoticeText');
            const discreteAuthLink = document.getElementById('discreteAuthLink');

            if (user) {
                badge.innerText = `Connected: ${user.email}`;
                badge.style.display = 'block';
                if(noticeEl) noticeEl.style.display = 'none';
                discreteAuthLink.innerText = "Manage Account Profile";
                
                actionBtnContainer.innerHTML = `<button id="logoutBtn" class="auth-btn auth-btn-secondary">Log Out</button>`;
                document.getElementById('logoutBtn').addEventListener('click', () => window.firebaseLogOut());
                
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    window.setStatsObject(docSnap.data());
                }
            } else {
                badge.style.display = 'none';
                if(noticeEl) noticeEl.style.display = 'block';
                discreteAuthLink.innerText = "Sign In (Optional)";
                
                actionBtnContainer.innerHTML = `
                    <button id="loginBtn" class="auth-btn auth-btn-primary">Log In</button>
                    <button id="signupBtn" class="auth-btn auth-btn-secondary">Sign Up</button>
                `;
                document.getElementById('loginBtn').addEventListener('click', () => window.handleAuthAction('login'));
                document.getElementById('signupBtn').addEventListener('click', () => window.handleAuthAction('signup'));
            }
        });
    </script>
</head>

            <div id="authActionGroup" class="auth-btn-group">
                </div>

    </div>
</div>
